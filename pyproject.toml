[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missyou-povbin"
version = "0.1.0"
description = "Video conversion for the legacy 5DDisplayer POV binary format"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9"]

[project.scripts]
povbin = "povbin.cli:main"

[tool.setuptools]
packages = ["povbin"]
