
    <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
            <style type="text/css">
                html,
                body {
                    user-select: none;
                    -moz-user-select: none;
                    -webkit-user-select: none;
                }
                body,
                ul,
                ol,
                dl,
                dd,
                h1,
                h2,
                h3,
                h4,
                h5,
                h6,
                p,
                input,
                select,
                textarea,
                form {
                    margin: 0;
                    padding: 0;
                }
                ul,
                ol {
                    list-style: none;
                }
                textarea {
                    resize: none;
                }
                html {
                    height: 100%;
                    overflow: hidden;
                }
                body {
                    height: 100%;
                    overflow: hidden;
                    user-select: none;
                    -moz-user-select: none;
                    -webkit-user-select: none;
                    background-repeat: no-repeat;
                    background-position: center;
                    background-size: 100% 100%;
                    font-family: '微软雅黑';
                    background-color: #000000;
                }
                .middle {
                    width: 100vw;
                    height: 100vw;
                    position: absolute;
                    left: 0;
                    top: 50%;
                    transform: translateY(-50%);
                }
                #drag-container {
                    width: 100vw;
                    height: 100vw;
                    margin: 0;
                    position: relative;
                    transform-style: preserve-3d;
                    -webkit-transform-style: preserve-3d;
                }
                .box {
                    width: 80%;
                    aspect-ratio: 1;
                    position: absolute;
                    left: 50%;
                    top: 50%;
                    transform: translate(-50%, -50%);
                    transform-style: preserve-3d;
                    -webkit-transform-style: preserve-3d;
                    color: {{COLOR}};
                }
                .ring {
                    width: 100%;
                    height: 100%;
                    transform-style: preserve-3d;
                    -webkit-transform-style: preserve-3d;
                    position: absolute;
                }
                li {
                    backface-visibility: visible;
                    -webkit-backface-visibility: visible;
                    transform-style: preserve-3d;
                    -webkit-transform-style: preserve-3d;
                }
                .ring li {
                    text-align: center;
                    position: absolute;
                }
                li.all {
                    transition: none;
                }

                li.one {
                    transition: none;
                }
            </style>
        </head>
        <body>
            <div class="middle">
                <div id="drag-container">
                    <div class="box" id="box">
                        <ul class="ring">
                        </ul>
                    </div>
                </div>
            </div>
        </body>
    </html>
