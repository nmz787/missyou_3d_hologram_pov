<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vw}</style>
</head><body><canvas id="c"></canvas>
<script>
try {
var TEXT="Hello";
var COLOR="#25fc11";
var FONTSIZE=42;

var c=document.getElementById('c');
var ctx=c.getContext('2d');
var dpr=window.devicePixelRatio||1;
var S=0;
var textWidth=0;
var gap=60;
var segmentWidth=0;
var offsetX=0;
var stepSize=0;
var iTimer=null;

function init(){
  S=Math.min(window.innerWidth,window.innerHeight);
  if(S<=0){setTimeout(init,50);return;}
  c.width=S*dpr;
  c.height=S*dpr;
  c.style.width=S+'px';
  c.style.height=S+'px';

  ctx.save();
  ctx.scale(dpr,dpr);
  ctx.font=FONTSIZE+'px sans-serif';
  textWidth=ctx.measureText(TEXT).width;
  ctx.restore();

  segmentWidth=textWidth+gap;
  stepSize=segmentWidth/200;
  speed=segmentWidth/10000;

  render();
  iTimer=requestAnimationFrame(animLoop);
}
// init() 移到所有函数定义之后

function render(){
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // 清屏
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,S,S);

  // 设置文字样式
  ctx.fillStyle=COLOR;
  ctx.font=FONTSIZE+'px sans-serif';
  ctx.textBaseline='middle';

  // 从 -segmentWidth 开始画，确保左边滚入时也有内容
  var startX = -(offsetX % segmentWidth);
  for(var x=startX; x<S; x+=segmentWidth){
    ctx.fillText(TEXT, x, S/2);
  }

  ctx.restore();
}

// 速度：像素/毫秒（在 init 里赋值）
var speed=0;
var lastTime=0;

function animLoop(ts){
  if(!lastTime)lastTime=ts;
  var dt=ts-lastTime;
  lastTime=ts;
  offsetX+=speed*dt;
  render();
  iTimer=requestAnimationFrame(animLoop);
}

function tick(){
  offsetX+=stepSize;
  render();
}

// 导出接口
window.pauseAnimation=function(){if(iTimer){cancelAnimationFrame(iTimer);iTimer=null;}};
window.resumeAnimation=function(){if(!iTimer){lastTime=0;iTimer=requestAnimationFrame(animLoop);}};
window.stepFrame=function(n){n=n||1;for(var i=0;i<n;i++){offsetX+=stepSize;}render();};
window.getTotalSteps=function(){return 200;};

// 批量导出
window.exportFrames=function(totalSteps){
  try{
    cancelAnimationFrame(iTimer);iTimer=null;
    offsetX=0;

    // 完全独立的 720px 坐标系，不依赖显示 canvas 的任何变量
    var eS=720;
    var ec=document.createElement('canvas');
    ec.width=eS;ec.height=eS;
    var ectx=ec.getContext('2d');

    // 字体按比例放大到 720px canvas
    var eFontSize=Math.round(FONTSIZE*eS/S);

    // 在导出 canvas 上独立测量文字宽度
    ectx.font=eFontSize+'px sans-serif';
    var eTextWidth=ectx.measureText(TEXT).width;
    var eGap=Math.round(60*eS/S);
    var eSegW=eTextWidth+eGap;
    // 每步移动量：整数像素，避免抖动
    var eStep=Math.max(1, Math.round(eSegW/200));
    var eOffset=0;

    function eRender(){
      ectx.fillStyle='#000';
      ectx.fillRect(0,0,eS,eS);
      ectx.fillStyle=COLOR;
      ectx.font=eFontSize+'px sans-serif';
      ectx.textBaseline='middle';
      var x=-(eOffset % eSegW);
      while(x<eS){
        ectx.fillText(TEXT,x,eS/2);
        x+=eSegW;
      }
    }

    var frameIdx=0,BATCH=10;
    function processBatch(){
      try{
        var batch=[];
        var end=Math.min(frameIdx+BATCH,totalSteps);
        for(var i=frameIdx;i<end;i++){
          eOffset+=eStep;
          eRender();
          batch.push({i:i,d:ec.toDataURL('image/jpeg',0.9)});
        }
        frameIdx=end;
        window.ReactNativeWebView.postMessage(JSON.stringify({t:'b',f:batch}));
        if(frameIdx<totalSteps) setTimeout(processBatch,0);
        else window.ReactNativeWebView.postMessage(JSON.stringify({t:'d',n:totalSteps}));
      }catch(e){window.ReactNativeWebView.postMessage(JSON.stringify({t:'e',m:''+e}));}
    }
    processBatch();
  }catch(e){window.ReactNativeWebView.postMessage(JSON.stringify({t:'e',m:''+e}));}
};

// 所有函数定义完毕，启动初始化
init();

} catch(err) {
  document.body.style.color='red';
  document.body.innerText='Error: '+err.message;
}
</script></body></html>
